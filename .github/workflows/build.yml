name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="0.2.${VERSION_CODE}"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "SVCAM_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SVCAM_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Vulkan host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers
          test -x /usr/bin/glslc
          test -f /usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake
          rm -rf /tmp/svcam-vulkan-headers
          mkdir -p /tmp/svcam-vulkan-headers
          cp -a /usr/include/vulkan /tmp/svcam-vulkan-headers/
          test -f /tmp/svcam-vulkan-headers/vulkan/vulkan.hpp

      - name: Install native Android toolchain
        run: |
          sdkmanager \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SemanticVectorCamera-v${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
