name: Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'llama.cpp'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.gitmodules'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svcam-release
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.2.${{ github.run_number }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install native Android toolchain
        run: |
          sdkmanager \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/svcam-release.jks"

      - name: Build signed release
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SVCAM_VERSION_NAME: ${{ env.RELEASE_VERSION }}
          SVCAM_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PSVCAM_KEYSTORE_PATH="$RUNNER_TEMP/svcam-release.jks" \
            -PSVCAM_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
            -PSVCAM_KEY_ALIAS="$KEY_ALIAS" \
            -PSVCAM_KEY_PASSWORD="$KEY_PASSWORD"
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          OUT="SemanticVectorCamera-v${RELEASE_VERSION}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Semantic Vector Camera v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            SemanticVectorCamera-v${{ env.RELEASE_VERSION }}.apk
            SemanticVectorCamera-v${{ env.RELEASE_VERSION }}.apk.sha256
