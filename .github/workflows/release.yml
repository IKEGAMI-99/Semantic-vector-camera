name: Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'llama.cpp'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.gitmodules'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svcam-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="0.2.${VERSION_CODE}"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "SVCAM_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SVCAM_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Vulkan host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers
          test -x /usr/bin/glslc
          test -f /usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake
          rm -rf /tmp/svcam-vulkan-headers
          mkdir -p /tmp/svcam-vulkan-headers
          cp -a /usr/include/vulkan /usr/include/spirv /tmp/svcam-vulkan-headers/
          test -f /tmp/svcam-vulkan-headers/vulkan/vulkan.hpp
          test -f /tmp/svcam-vulkan-headers/spirv/unified1/spirv.hpp

      - name: Install native Android toolchain
        run: |
          sdkmanager \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build stable signed release
        run: |
          gradle :app:assembleRelease --stacktrace
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          OUT="SemanticVectorCamera-v${SVCAM_VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Semantic Vector Camera v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            SemanticVectorCamera-v${{ steps.version.outputs.name }}.apk
            SemanticVectorCamera-v${{ steps.version.outputs.name }}.apk.sha256
